epochs: 1000
train_iterations_per_epoch: 1500
val_iterations_per_epoch: 50

precision: bf16
gradient_clip_norm: null

output_dir: ./fmbench_results
checkpoint_every: 1
compile_model: false
find_unused_parameters: false
stop_on_nonfinite_loss: true

optimizer:
  name: adamw
  lr: 0.0006
  weight_decay: 0.04
  betas: [0.9, 0.95]

scheduler:
  name: warmup_cosine
  warmup_epochs: 40
  final_lr: 0.0
