name: swin3d
params:
  input_channels: 1
  patch_size: [2, 2, 2]
  window_size: [7, 7, 7]
  embed_dim: 128
  depths: [2, 2, 18, 2]
  num_heads: [4, 8, 16, 32]
  mlp_ratio: 4.0
  qkv_bias: true
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.2
  patch_norm: false
  use_checkpoint: false
  downsample: merging
  use_v2: false
  normalize: true
